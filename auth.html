
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yalo AI - Account</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b14;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
}
.card{
 width:100%;
 max-width:420px;
 background:#111827;
 border:1px solid #293247;
 padding:30px;
 border-radius:18px;
}
.logo{
 color:#9583ff;
 font-size:27px;
 font-weight:bold;
 text-align:center;
 margin-bottom:25px;
}
h2{text-align:center}
p{text-align:center;color:#9da7bb}
input{
 width:100%;
 padding:15px;
 margin-top:15px;
 background:#080b14;
 border:1px solid #303951;
 border-radius:9px;
 color:white;
}
button{
 width:100%;
 padding:15px;
 margin-top:20px;
 background:#8069ff;
 color:white;
 border:0;
 border-radius:9px;
 font-weight:bold;
 cursor:pointer;
}
#status{
 font-size:13px;
 margin-top:15px;
}
.switch{
 cursor:pointer;
 color:#a997ff;
}
</style>
</head>
<body>

<div class="card">
 <div class="logo">Yalo AI.</div>
 <h2 id="heading">Create Account</h2>
 <p>Join the future of AI intelligence.</p>

 <form id="authForm">
  <input id="email" type="email"
   placeholder="Email address" required>

  <input id="password" type="password"
   placeholder="Password (6 characters minimum)"
   minlength="6" required>

  <button id="submitBtn" type="submit">
   Create Account
  </button>
 </form>

 <p id="status"></p>

 <p>
  <span id="switchText">Already have an account?</span>
  <span class="switch" id="switchBtn">Login</span>
 </p>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

// Replace with your Firebase web app configuration
const firebaseConfig = {
 apiKey: "YOUR_FIREBASE_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 projectId: "YOUR_PROJECT_ID",
 appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isLogin = false;

const form = document.getElementById("authForm");
const status = document.getElementById("status");
const heading = document.getElementById("heading");
const submitBtn = document.getElementById("submitBtn");

document.getElementById("switchBtn")
.addEventListener("click", () => {
 isLogin = !isLogin;
 heading.textContent = isLogin ? "Welcome Back" : "Create Account";
 submitBtn.textContent = isLogin ? "Login" : "Create Account";
 document.getElementById("switchText").textContent =
 isLogin ? "New to Yalo AI?" : "Already have an account?";
 document.getElementById("switchBtn").textContent =
 isLogin ? "Register" : "Login";
 status.textContent = "";
});

form.addEventListener("submit", async (e) => {
 e.preventDefault();

 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 submitBtn.disabled = true;
 status.textContent = "Please wait...";

 try {
  if (isLogin) {
   const result = await signInWithEmailAndPassword(
    auth, email, password
   );
   status.textContent = "Login successful!";
   window.location.href = "dashboard.html";
  } else {
   const result = await createUserWithEmailAndPassword(
    auth, email, password
   );
   await sendEmailVerification(result.user);
   status.textContent =
    "Account created! Check your email to verify your account.";
  }
 } catch (error) {
  status.textContent = error.message;
 } finally {
  submitBtn.disabled = false;
 }
});
</script>

</body>
</html>

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
